# Levanta la base de datos MySQL requerida por la prueba.
#
#   docker compose up -d
#
# El esquema y los datos de ejemplo NO se crean aqui: los aplica Flyway
# automaticamente cuando arranca la aplicacion Spring Boot.
#
# SI EL PUERTO 3306 YA ESTA OCUPADO (por un MySQL instalado en la maquina),
# Docker falla con "bind: address already in use". En ese caso se publica el
# contenedor en otro puerto del host y se le indica a la aplicacion cual usar:
#
#   MYSQL_HOST_PORT=3307 docker compose up -d
#   DB_PORT=3307 ./mvnw spring-boot:run
services:
  mysql:
    image: mysql:8.4
    container_name: mobilia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mobilia_contracts
      MYSQL_USER: mobilia
      MYSQL_PASSWORD: mobilia
    ports:
      # El puerto del HOST es configurable; el del contenedor siempre es 3306.
      # Evita el choque con un MySQL ya instalado sin tener que detenerlo.
      - "${MYSQL_HOST_PORT:-3306}:3306"
    command:
      # Colacion insensible a mayusculas Y a tildes: "jose" encuentra "José".
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mobilia-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mobilia-mysql-data:
