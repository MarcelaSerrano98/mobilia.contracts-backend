# Levanta la base de datos MySQL requerida por la prueba.
#
#   docker compose up -d
#
# El esquema y los datos de ejemplo NO se crean aqui: los aplica Flyway
# automaticamente cuando arranca la aplicacion Spring Boot.
#
# SI EL PUERTO 3306 YA ESTA OCUPADO (por un MySQL instalado en la maquina),
# Docker falla con "bind: address already in use". En ese caso basta con
# exportar DB_PORT una sola vez: la MISMA variable configura el puerto que
# publica este contenedor y el puerto al que se conecta la aplicacion, de modo
# que es imposible que queden desincronizados.
#
#   export DB_PORT=3307
#   docker compose up -d
#   ./mvnw spring-boot:run
services:
  mysql:
    image: mysql:8.4
    container_name: mobilia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mobilia_contracts
      MYSQL_USER: mobilia
      MYSQL_PASSWORD: mobilia
    ports:
      # Se reutiliza DB_PORT a proposito, la misma variable que lee la
      # aplicacion en application.yml. Con dos variables distintas era posible
      # publicar el contenedor en un puerto y conectar la aplicacion a otro:
      # en una maquina con MySQL instalado el fallo no saltaba, porque la
      # aplicacion acababa hablando con la base local sin avisar.
      #
      # El puerto de la IZQUIERDA es el del host y es configurable; el de la
      # DERECHA es el del contenedor y siempre es 3306.
      - "${DB_PORT:-3306}:3306"
    command:
      # Colacion insensible a mayusculas Y a tildes: "jose" encuentra "José".
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mobilia-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mobilia-mysql-data:
