# Levanta la base de datos MySQL requerida por la prueba.
#
#   docker compose up -d
#
# El esquema y los datos de ejemplo NO se crean aqui: los aplica Flyway
# automaticamente cuando arranca la aplicacion Spring Boot.
services:
  mysql:
    image: mysql:8.4
    container_name: mobilia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mobilia_contracts
      MYSQL_USER: mobilia
      MYSQL_PASSWORD: mobilia
    ports:
      - "3306:3306"
    command:
      # Colacion insensible a mayusculas Y a tildes: "jose" encuentra "José".
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mobilia-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mobilia-mysql-data:
